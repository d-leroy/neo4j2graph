[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "panoramix"
version = "0.1.0"
description = "Convert Arcane XML/AXL configs to JSON and import into Neo4j graph database"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
license = {text = "MIT"}
keywords = ["arcane", "neo4j", "xml", "json", "graph-database"]

dependencies = [
    "xmltodict>=0.13.0",
    "neo4j>=5.0.0",
    "numpy>=1.24.0",
    "mcp>=1.0.0",
    "fastmcp>=3.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/panoramix"]

[tool.hatch.build]
ignore-vcs = true

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "ruff>=0.1.0",
]

[project.scripts]
panoramix = "panoramix.cli:main"
panoramix-mcp = "panoramix.server:main"

[tool.uv]
dev-dependencies = [
    "pytest>=7.0",
    "black>=23.0",
    "ruff>=0.1.0",
]
